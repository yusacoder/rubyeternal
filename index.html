
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080a10">

  <title>RUBY | Eternal Production</title>
  <meta name="description" content="Eternal Production ekip profili">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="background"></div>
  <div class="background-overlay"></div>

  <nav class="navbar">
    <div class="navbar-logo" id="navbarTitle">RUBY</div>
  </nav>

  <main class="main">

    <header class="profile">

      <div class="avatar-wrapper">
        <img id="avatar" class="avatar" src="" alt="Profil fotoğrafı">
      </div>

      <div class="name-line">
        <h1 class="name" id="name"></h1>
        <i id="verified" class="fa-solid fa-circle-check verified"></i>
      </div>

      <p class="username" id="username"></p>

      <div class="badges" id="badges"></div>

      <p class="description" id="description"></p>

    </header>

    <section class="section" id="aboutSection">
      <h2 class="section-heading" id="aboutHeading"></h2>
      <div class="glass">
        <p class="about-text" id="aboutText"></p>
      </div>
    </section>

    <section class="section" id="tasksSection">
      <h2 class="section-heading" id="tasksHeading"></h2>
      <div class="task-grid" id="tasksGrid"></div>
    </section>

    <section class="section" id="companySection">
      <h2 class="section-heading">
        <i class="fa-solid fa-building"></i>
        Bağlı Olduğu Kurum
      </h2>

      <div class="glass company">
        <img id="companyLogo" class="company-logo" src="" alt="Kurum logosu">

        <div class="company-info">
          <h3 id="companyName"></h3>
          <p id="companyDescription"></p>
          <a id="companyLink" class="company-link" target="_blank" rel="noopener noreferrer">
            Resmî Web Sitesi
            <i class="fa-solid fa-arrow-up-right-from-square"></i>
          </a>
        </div>
      </div>
    </section>

    <section class="section" id="socialSection">
      <h2 class="section-heading" id="socialHeading"></h2>
      <div class="glass">
        <div class="socials" id="socialLinks"></div>
      </div>
    </section>

    <footer>
      <strong id="footerBrand"></strong>
      <p id="footerCopyright"></p>
      <p id="footerCredit"></p>
    </footer>

  </main>

  <div id="errorMessage" class="error-message" hidden>
    Profil bilgileri yüklenemedi. data.json dosyasını kontrol edin.
  </div>

  <script src="app.js"></script>

</body>
</html>
